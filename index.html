<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap cdn -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap ICON CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- style.css -->
    <link rel="stylesheet" href="style.css" />
    <title>Contact List API</title>
  </head>
  <body>
    <div class="wrapper flex">
      <div class="phone border border-black rounded-4">
        <div class="top flex">
          <div>12:12</div>

          <div class="speaker border rounded-5"></div>
          <div>
            <i class="bi bi-wifi"></i>
            <i class="bi bi-battery-half"></i>
            <i class="bi bi-reception-4"></i>
          </div>
        </div>
        <!-- Home screen -->
        <main class="main home-screen">
          <div
            class="slider-container border border-black rounded-5 p-2 position-relative"
          >
            <input
              class="slider"
              id="mySlider"
              type="range"
              min="0"
              max="100"
              value="0"
            />
            <label id="label" class="position-absolute text-center"
              >Slide to Unlock</label
            >
          </div>
        </main>

        <!-- App screen -->
        <main class="app-screen bg-dark p-2" style="display: none">
          <div
            id="contact"
            class="contact d-flex justify-content-center align-items-center flex-column"
          >
            <i
              class="bi bi-person-rolodex bg-white rounded-3 fs-5 p-3 mt-5 text-danger"
            ></i>
            <span class="text-white">contact</span>
          </div>
        </main>

        <!-- contact List -->
        <main class="contact-list bg-light h-100 p-2" style="display: none">
          <div class="spinner spinner-border position-absolute" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <div class="contact-list-container p-2">
            <h3>Contacts</h3>
            <div class="search position-relative d-flex justify-content-center">
              <i class="bi bi-search position-absolute search-icon"></i>
              <input type="text" id="search" />
            </div>
          </div>
          <div id="user-count">10 Contacts</div>
          <div class="contact-list-accordian p-2">
            <div class="accordion" id="accordionUser"></div>
          </div>
        </main>
      </div>
    </div>
    <!-- Bootstrap script -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
